name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: node {0}
        run: |
          const fs = require("fs");
          const tag = process.env.GITHUB_REF_NAME || "";
          const ver = tag.replace(/^v/, "");
          if (!/^\d+\.\d+\.\d+/.test(ver)) process.exit(0);
          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            data.version = ver;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          }
          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8").replace(
            /^version\s*=\s*"[^"]+"/m,
            `version = "${ver}"`
          );
          fs.writeFileSync(cargoPath, cargo);

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Synology Drive Client v__VERSION__"
          releaseBody: "請依作業系統下載對應安裝檔（Windows / macOS Apple Silicon & Intel / Linux）。"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
